<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Quiz - The Ultimate Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>🃏 Poker Quiz 🎯</h1>
            <p class="subtitle">Play poker, answer questions, win big!</p>
        </header>

        <div id="setup-screen" class="screen active">
            <div class="setup-content">
                <h2>Game Setup</h2>
                <div class="player-setup">
                    <label for="player1-name">Player 1 Name:</label>
                    <input type="text" id="player1-name" value="Player 1">
                </div>
                <div class="player-setup">
                    <label for="player2-name">Player 2 Name:</label>
                    <input type="text" id="player2-name" value="Player 2">
                </div>
                <div class="player-setup">
                    <label for="starting-chips">Starting Chips:</label>
                    <input type="number" id="starting-chips" value="1000" min="100" step="100">
                </div>
                <div class="player-setup">
                    <label for="small-blind">Small Blind:</label>
                    <input type="number" id="small-blind" value="10" min="5" step="5">
                </div>
                <button id="start-game-btn" class="btn btn-primary">Start Game</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-info">
                <div class="round-info">
                    <span id="round-number">Round: 1</span>
                    <span id="pot-amount">Pot: $0</span>
                </div>
            </div>

            <div class="players-container">
                <div id="player1-area" class="player-area">
                    <div class="player-header">
                        <h3 id="player1-display-name">Player 1</h3>
                        <div class="player-stats">
                            <span id="player1-chips" class="chips">Chips: $1000</span>
                            <span id="player1-quiz-cards" class="quiz-cards">Quiz Cards: 20</span>
                        </div>
                    </div>
                    <div id="player1-cards" class="card-container"></div>
                    <div class="player-actions" id="player1-actions"></div>
                </div>

                <div id="player2-area" class="player-area">
                    <div class="player-header">
                        <h3 id="player2-display-name">Player 2</h3>
                        <div class="player-stats">
                            <span id="player2-chips" class="chips">Chips: $1000</span>
                            <span id="player2-quiz-cards" class="quiz-cards">Quiz Cards: 20</span>
                        </div>
                    </div>
                    <div id="player2-cards" class="card-container"></div>
                    <div class="player-actions" id="player2-actions"></div>
                </div>
            </div>

            <div id="community-cards" class="community-cards">
                <h4>Community Cards</h4>
                <div id="community-cards-container"></div>
            </div>

            <div id="action-buttons" class="action-buttons">
                <button id="fold-btn" class="btn btn-danger">Fold</button>
                <button id="call-btn" class="btn btn-secondary">Call</button>
                <button id="raise-btn" class="btn btn-primary">Raise</button>
            </div>

            <div id="game-messages" class="game-messages"></div>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="quiz-content">
                <h2>🎯 Quiz Time!</h2>
                <p id="quiz-instruction" class="quiz-instruction"></p>
                <div id="quiz-card" class="quiz-card">
                    <p id="quiz-question" class="quiz-question"></p>
                    <div id="quiz-options" class="quiz-options"></div>
                </div>
                <div id="quiz-result" class="quiz-result hidden"></div>
                <button id="continue-btn" class="btn btn-primary hidden">Continue to Next Hand</button>
            </div>
        </div>

        <div id="game-over-screen" class="screen">
            <div class="game-over-content">
                <h2>🏆 Game Over!</h2>
                <p id="winner-message" class="winner-message"></p>
                <div id="final-stats" class="final-stats"></div>
                <button id="new-game-btn" class="btn btn-primary">New Game</button>
            </div>
        </div>
    </div>

    <script src="poker.js"></script>
    <script src="quiz.js"></script>
    <script src="game.js"></script>
</body>
</html>
